     <script>
        // Get input from user
        let input = prompt("Input integer number");

        // Convert input to int
        let number = parseInt(input);

        // Check if its even/odd/zero/non-number
        if (isNaN(number)) {
            alert("Please input integer number only!");
        } else if (number === 0) {
            alert("zero integer number");
        } else if (number % 2 === 0) {
            alert("even integer number");
        } else {
            alert("odd integer number");
        }
    </script>
